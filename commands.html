<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명령어 — 펭귄서버 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<script>window.PW_ROOT = './';</script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="container narrow stack" style="gap: 22px">
    <nav class="breadcrumb" aria-label="현재 위치" style="margin: 0">
      <a href="index.html">홈</a><span aria-hidden="true">›</span><a href="guide.html">가이드</a><span aria-hidden="true">›</span><span class="cur">명령어</span>
    </nav>
    <div class="row-between">
      <div class="stack" style="gap: 12px">
        <div class="page-title"><span class="seal" aria-hidden="true"></span><h1>명령어</h1></div>
        <span class="subtitle">복사 버튼을 누르면 바로 채팅창에 붙여넣을 수 있습니다</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center">
        <div class="search" style="border-color: var(--line); background: var(--card); width: 240px; height: 44px">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A4529" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="q" aria-label="명령어 검색" placeholder="명령어 검색" autocomplete="off">
        </div>
        <a class="btn sm secondary" data-auth="editor" hidden href="admin/index.html#commands">명령어 편집</a>
      </div>
    </div>
    <div class="filter-row" id="tabs" style="padding-bottom: 16px; border-bottom: 1px solid var(--line)"></div>
    <div class="card plain table" id="list" style="--tmin: 640px"><div class="loading" style="padding: 20px">불러오는 중입니다</div></div>
    <div class="notice-box" id="note" hidden></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter, $, esc, copyText } from './assets/js/ui.js';
  renderHeader('commands');
  renderFooter();
  const COPY = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const CHECK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  try {
    const { watchAuth } = await import('./assets/js/auth.js');
    watchAuth();
    import('./assets/js/popups.js');
    const C = await import('./assets/js/content.js');
    const cmds = await C.listCommands();
    const cats = [...new Set(cmds.map((c) => c.category).filter(Boolean))];
    let active = '', q = '';
    $('#tabs').innerHTML = `<button type="button" class="btn sm dark" data-cat="">전체</button>` + cats.map((c) => `<button type="button" class="btn sm ghost" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
    $('#tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      active = b.dataset.cat;
      $('#tabs').querySelectorAll('[data-cat]').forEach((x) => { x.className = `btn sm ${x === b ? 'dark' : 'ghost'}`; });
      draw();
    });
    $('#q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); draw(); });

    function draw() {
      const list = $('#list');
      const shown = cmds.filter((c) => (!active || c.category === active) && (!q || `${c.command} ${c.aliases || ''} ${c.desc || ''}`.toLowerCase().includes(q)));
      if (!shown.length) { list.innerHTML = `<div class="empty">${cmds.length ? '검색 결과가 없습니다.' : '아직 등록된 명령어가 없습니다.'}</div>`; return; }
      list.innerHTML = `<div class="thead" style="grid-template-columns: 240px minmax(0,1fr) 110px 100px"><span>명령어</span><span>설명</span><span>권한</span><span></span></div>` +
        shown.map((c) => `
          <div class="tr" style="grid-template-columns: 240px minmax(0,1fr) 110px 100px; min-height: 64px">
            <div class="stack" style="gap: 4px; align-items: flex-start">
              <code class="cmd-chip">${esc(c.command)}</code>
              ${c.aliases ? `<span style="font-size: 11px; color: var(--muted)">별칭 ${esc(c.aliases)}</span>` : ''}
            </div>
            <span class="wrap" style="font-size: 14px">${esc(c.desc || '')}</span>
            <span>${c.permission ? `<span class="tag">${esc(c.permission)}</span>` : ''}</span>
            <button type="button" class="btn sm secondary" data-copy="${esc(c.command)}">${COPY} 복사</button>
          </div>`).join('');
    }
    $('#list').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-copy]'); if (!b) return;
      if (await copyText(b.dataset.copy)) {
        b.className = 'btn sm success'; b.innerHTML = `${CHECK} 복사됨`;
        setTimeout(() => { b.className = 'btn sm secondary'; b.innerHTML = `${COPY} 복사`; }, 1500);
      }
    });
    draw();
  } catch (e) {
    console.warn(e);
    $('#list').innerHTML = '<div class="empty">명령어를 불러오지 못했습니다.</div>';
  }
</script>
</body>
</html>
