<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컨텐츠 — 펭귄서버 위키</title>
<link rel="stylesheet" href="assets/css/site.css">
<script>window.PW_ROOT = './';</script>
</head>
<body>
<header id="site-header"></header>
<script src="assets/js/header-cache.js"></script>

<main>
  <div class="container guide-layout">
    <script>/* 이용약관 · 개인정보 처리방침 · 펭귄법전은 왼쪽 목차 없이 (그리기 전에 정해 깜빡임 없게) */ if (/[?&]p=(terms|privacy|rules)(&|$)/.test(location.search)) document.currentScript.parentElement.classList.add('standalone');</script>

    <div style="display: contents">
    <button type="button" class="btn sm secondary tree-toggle" id="tree-toggle" aria-expanded="false" aria-controls="tree">목차 보기</button>
    <aside class="card tree" aria-label="컨텐츠 목차" id="tree">
      <div class="head"><span class="seal sm" aria-hidden="true"></span>컨텐츠<span id="tree-qtag"></span></div>
      <label class="tree-find"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="tree-find" placeholder="문서 찾기 (초성 OK)" aria-label="목차에서 문서 찾기" autocomplete="off" enterkeyhint="search"></label>
      <div id="tree-list"><div class="loading">목차를 불러오는 중입니다</div></div>
    </aside>
    </div>

    <article id="article">
      <nav class="breadcrumb" aria-label="현재 위치" id="breadcrumb">
        <a href="index.html">홈</a><span aria-hidden="true">›</span><a href="guide.html">컨텐츠</a>
      </nav>
      <div class="article-head">
        <h1 id="title">컨텐츠</h1>
        <div style="display: flex; gap: 8px; flex-shrink: 0" data-auth="editor" hidden id="edit-actions">
          <a class="btn sm secondary" id="btn-edit" href="admin/editor.html">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            편집
          </a>
          <a class="btn sm ghost" id="btn-history" href="admin/index.html#history">이력</a>
        </div>
      </div>
      <div class="article-meta" id="meta"></div>
      <div class="prose" id="content"><div class="loading">문서를 불러오는 중입니다</div></div>
      <nav class="page-nav" id="page-nav" hidden></nav>
    </article>

    <aside class="toc" id="toc" aria-label="이 문서의 목차" hidden>
      <span class="label">목차</span>
    </aside>

  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter, $, esc, param, fmtDate } from './assets/js/ui.js';
  import { guideIllustration } from './assets/js/illustrations.js';
  import { buildTree, flatten, treeTitle } from './assets/js/tree.js';
  // 따로 보는 문서는 상단 메뉴에서 컨텐츠를 켜지 않음 (펭귄법전만 자기 메뉴)
  const standalone = $('.guide-layout').classList.contains('standalone');
  renderHeader(standalone ? (param('p') === 'rules' ? 'law' : '') : 'guide');
  renderFooter();

  const CHEV = '<svg class="chev" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#8A7D66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const setTreeOpen = (open) => { $('#tree').classList.toggle('open', open); $('#tree-toggle').setAttribute('aria-expanded', String(open)); $('#tree-toggle').textContent = open ? '목차 닫기' : '목차 보기'; };
  $('#tree-toggle').addEventListener('click', () => setTreeOpen(!$('#tree').classList.contains('open')));

  // 이용약관 · 개인정보 처리방침 · 펭귄법전은 주소가 정해진 따로 보는 문서(하단 링크 · 상단 메뉴 · 홈 버튼) — 목차와 이전/다음 이동에서는 뺍니다
  const FOOTER_DOCS = { terms: '이용약관', privacy: '개인정보 처리방침', rules: '펭귄법전' };
  const isFooterDoc = (id) => Object.hasOwn(FOOTER_DOCS, id);

  // 빨리 보이게 하는 두 가지
  //  1) 목차 · 문서(공개분)를 브라우저에 기억해 두었다가 다음에 들어오면 먼저 그리고, 서버에서 받은 내용이 다르면 다시 그립니다
  //  2) 목차 · 이전/다음 · 본문 속 링크로 다른 문서를 열 때는 페이지를 다시 불러오지 않고 본문만 바꿉니다
  //     (주소는 그대로 바뀌어 뒤로 가기 · 새로고침 · 주소 공유가 됩니다)
  const DATA_KEY = 'pw_guide_v1';
  // 섹션 펼침은 지금 보는 문서에서만 기억 (다른 문서로 가면 그 문서가 든 섹션만 펼친 상태로 돌아감)
  let treeOpen = {};
  let treeDoc;      // treeOpen 이 어느 문서에서 만든 것인지
  let findQ = '';   // 목차 찾기 칸에 쓴 글자
  try { localStorage.removeItem('pw_tree_open'); } catch {} // 예전에 기억해 두던 펼침 상태는 지움
  const urlState = (u) => ({ slug: u.searchParams.get('p'), sec: u.searchParams.get('s'), q: (u.searchParams.get('q') || '').trim().toLowerCase(), hl: (u.searchParams.get('hl') || '').trim() });
  let at = urlState(new URL(location.href));
  let data = null;   // { sections, pages, extra } 지금 그린 목차 · 문서
  let editor = null; // 로그인 확인 전에는 null
  let fresh = false; // 서버에서 받은 데이터로 그렸는지
  let hlDone = '';  // 검색어 줄로 이미 옮겨 준 문서
  let shown = null;  // 본문에 그린 문서 (같으면 다시 그리지 않음)
  let treeHtml = '';
  let md = null;
  const mdReady = import('./assets/js/markdown.js').then((m) => (md = m));

  const viewOf = () => {
    const { tree, orphans } = buildTree(data.sections, data.pages.filter((p) => !isFooterDoc(p.id)));
    return { tree, orphans, flat: flatten(tree, orphans) };
  };
  // 현재 문서: ?p= > ?s=(섹션 첫 문서) > 첫 문서
  const pick = (v) => {
    if (at.slug) return data.pages.find((p) => p.id === at.slug) || (data.extra && data.extra.id === at.slug ? data.extra : null);
    if (at.sec) {
      // 홈 카드(?s=)에서 왔을 때: 그 섹션의 첫 문서, 섹션에 바로 든 문서가 없으면 하위 섹션의 첫 문서
      const childIds = data.sections.filter((c) => c.parentId === at.sec).map((c) => c.id);
      return v.flat.find((p) => p.sectionId === at.sec) || v.flat.find((p) => childIds.includes(p.sectionId)) || null;
    }
    return at.q ? null : v.flat[0] || null;
  };

  // ---- 목차 ----
  // 지금 보는 문서가 든 섹션만 펼칩니다 (직접 펼친 섹션은 이 문서를 보는 동안만 펼친 채로)
  // 문서가 1개뿐인 섹션은 접고 펴는 줄 없이 바로 그 문서로 가는 줄 하나로 보여 줍니다
  function renderTree(v, current) {
    const { q } = at;
    const docKey = current ? current.id : '';
    if (docKey !== treeDoc) { treeOpen = {}; treeDoc = docKey; }
    const filtering = !!q || !!findQ;
    const pageLink = (p, secName = '') => {
      const name = treeTitle(p.title, secName);
      return `<a class="page${current && p.id === current.id ? ' active' : ''}" href="guide.html?p=${encodeURIComponent(p.id)}"${name !== p.title ? ` title="${esc(p.title)}"` : ''}><span class="page-name">${esc(name)}</span>${p.public === false ? '<span class="tag gray draft">비공개</span>' : ''}</a>`;
    };
    // 찾기 칸: 문서 제목이나 그 문서가 든 섹션(상위 섹션 포함) 이름이 맞으면 보여 줌
    const secOf = (id) => data.sections.find((x) => x.id === id);
    const findHit = (p) => {
      if (!findQ || md.nameMatches(p.title, findQ)) return true;
      const sec = secOf(p.sectionId), parent = sec && sec.parentId ? secOf(sec.parentId) : null;
      return [sec, parent].some((x) => x && md.nameMatches(x.name, findQ));
    };
    const matches = (p) => (!q || (p.title || '').toLowerCase().includes(q)) && findHit(p);
    const openId = current ? current.sectionId : at.sec;
    const isOpen = (id, hasCurrent) => filtering || hasCurrent || treeOpen[id] === 1;
    // 문서 1개짜리 섹션: 섹션 아이콘 · 이름 줄을 누르면 바로 그 문서로
    const soloLink = (s, p, level) => `<a class="sec ${level} solo${current && p.id === current.id ? ' active' : ''}" href="guide.html?p=${encodeURIComponent(p.id)}"${p.title !== s.name ? ` title="${esc(p.title)}"` : ''}><span class="chev-gap" aria-hidden="true"></span>${level === 'top' ? `<span class="sec-ico" aria-hidden="true">${guideIllustration(s.name, s.icon)}</span>` : ''}<span class="sec-name">${esc(s.name)}</span>${p.public === false ? '<span class="tag gray draft">비공개</span>' : ''}</a>`;
    // 섹션 줄: 펼침 화살표 · (최상위만) 홈 카드와 같은 아이콘 · 이름 · 문서 수
    const secHead = (s, level, count, open) => `<div class="sec ${level}${open ? ' open' : ''}" data-toggle data-sec="${esc(s.id)}" role="button" tabindex="0" aria-expanded="${open}" aria-label="${esc(s.name)} (문서 ${count}개)">${CHEV}${level === 'top' ? `<span class="sec-ico" aria-hidden="true">${guideIllustration(s.name, s.icon)}</span>` : ''}<span class="sec-name">${esc(s.name)}</span><span class="cnt" aria-hidden="true">${count}</span></div>`;
    $('#tree-qtag').innerHTML = q ? ` <span class="tag" style="margin-left:auto">검색: ${esc(q)}</span>` : '';
    let html = '';
    v.tree.forEach((t) => {
      const own = t.pages.filter(matches);
      let kidCount = 0;
      const kids = t.children.map((c) => {
        const cPages = c.pages.filter(matches);
        if (filtering && !cPages.length) return '';
        kidCount += cPages.length;
        if (c.pages.length === 1 && cPages.length === 1) return soloLink(c.section, cPages[0], 'sub');
        const open = isOpen(c.section.id, c.section.id === openId);
        return secHead(c.section, 'sub', cPages.length, open) + `<div class="children"${open ? '' : ' hidden'}>${cPages.map((p) => pageLink(p, c.section.name)).join('')}</div>`;
      }).join('');
      if (filtering && !own.length && !kidCount) return;
      if (!t.children.length && t.pages.length === 1 && own.length === 1) { html += soloLink(t.section, own[0], 'top'); return; }
      const open = isOpen(t.section.id, t.section.id === openId || t.children.some((c) => c.section.id === openId));
      html += secHead(t.section, 'top', own.length + kidCount, open) + `<div class="children"${open ? '' : ' hidden'}>${own.map((p) => pageLink(p, t.section.name)).join('')}${kids}</div>`;
    });
    if (v.orphans.length) html += `<div class="children loose">${v.orphans.filter(matches).map((p) => pageLink(p)).join('')}</div>`;
    if (!v.tree.length && !v.orphans.length) html += '<div class="empty">아직 문서가 없습니다.</div>';
    else if (filtering && !html.includes('href=')) html += '<div class="empty">찾는 문서가 없어요.</div>';
    if (html !== treeHtml) { $('#tree-list').innerHTML = html; treeHtml = html; }
  }
  const toggleSec = (sec) => {
    const open = sec.classList.toggle('open');
    sec.setAttribute('aria-expanded', String(open));
    const ch = sec.nextElementSibling;
    if (ch) ch.hidden = !open;
    treeHtml = ''; // 직접 바꾼 화면이라 다음엔 새로 그림
    if (at.q || findQ) return; // 찾는 중 펼침은 기억하지 않음
    treeOpen[sec.dataset.sec] = open ? 1 : 0;
  };
  // 목차 찾기 칸: 쓰는 대로 제목으로 거름 (띄어쓰기 무시 · 초성 가능), Esc 로 지움
  const runFind = () => { findQ = $('#tree-find').value.trim(); if (data && md) renderTree(viewOf(), pick(viewOf())); };
  $('#tree-find').addEventListener('input', runFind);
  $('#tree-find').addEventListener('keydown', (e) => { if (e.key === 'Escape' && e.target.value) { e.target.value = ''; runFind(); } });
  $('#tree').addEventListener('click', (e) => { const sec = e.target.closest('[data-toggle]'); if (sec) toggleSec(sec); });
  $('#tree').addEventListener('keydown', (e) => {
    const sec = e.target.closest('[data-toggle]');
    if (sec && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleSec(sec); }
  });

  // ---- 본문 ----
  const setDoc = (title, crumb, body) => {
    document.title = `${title} — 펭귄서버 위키`;
    $('#title').textContent = title;
    $('#breadcrumb').innerHTML = crumb;
    $('#meta').innerHTML = '';
    $('#content').innerHTML = body;
    $('#toc').hidden = true;
    $('#page-nav').hidden = true;
    $('#btn-history').style.display = '';
    shown = null;
  };
  const HOME = '<a href="index.html">홈</a>';
  const SEP = '<span aria-hidden="true">›</span>';
  function renderBody(v, current) {
    const { slug, q } = at;
    if (!current && slug && !fresh) return; // 기억해 둔 목록에 없는 문서 — 서버 확인 뒤에 판단
    if (!current && slug && isFooterDoc(slug)) {
      // 아직 작성 전인 약관 · 처리방침 · 펭귄법전
      const name = FOOTER_DOCS[slug];
      const createHref = `admin/editor.html?new=${encodeURIComponent(slug)}&title=${encodeURIComponent(name)}`;
      setDoc(name, `${HOME}${SEP}<span class="cur">${esc(name)}</span>`, '<p>준비 중인 문서입니다. 곧 이 자리에 올라옵니다.</p>'
        + (editor ? `<div class="callout"><div><span class="callout-title">편집자 안내</span><p>이 문서는 주소가 <code>${esc(slug)}</code>로 정해져 있어요. <a href="${esc(createHref)}">여기서 새로 작성</a>하면 ${slug === 'rules' ? '상단 메뉴 · 홈 버튼 · 하단 링크의 「펭귄법전」이' : '하단 링크가'} 이 문서로 연결됩니다. 분류는 "미배치"로 두면 됩니다.</p></div></div>` : ''));
      $('#btn-edit').href = createHref;
      $('#btn-history').style.display = 'none';
      return;
    }
    const base = `${HOME}${SEP}<a href="guide.html">컨텐츠</a>`;
    if (!current && slug) return setDoc('문서를 찾을 수 없습니다', base, '<p>주소가 바뀌었거나 아직 공개되지 않은 문서입니다.</p>');
    if (!current) {
      return setDoc(q ? '검색 결과' : '컨텐츠', base, q
        ? (v.flat.some((p) => (p.title || '').toLowerCase().includes(q)) ? '<p>왼쪽 목차에서 검색된 문서를 선택해 주세요.</p>' : '<p>검색 결과가 없습니다.</p>')
        : '<p>왼쪽 목차에서 문서를 선택해 주세요.</p>');
    }
    if (current.public === false && !editor) return setDoc('비공개 문서', base, '<p>아직 공개되지 않은 문서입니다.</p>');

    document.title = `${current.title} — 펭귄서버 위키`;
    $('#title').textContent = current.title;
    const sec = data.sections.find((s) => s.id === current.sectionId);
    const parent = sec && sec.parentId ? data.sections.find((s) => s.id === sec.parentId) : null;
    $('#breadcrumb').innerHTML = HOME
      + (isFooterDoc(current.id) ? '' : `${SEP}<a href="guide.html">컨텐츠</a>`)
      + (parent ? `${SEP}<span>${esc(parent.name)}</span>` : '')
      + (sec ? `${SEP}<span>${esc(sec.name)}</span>` : '')
      + `${SEP}<span class="cur">${esc(current.title)}</span>`;
    // 작성자는 편집자에게만 표시 (유저에게는 최종 수정일만). 날짜는 게시 기준 — 임시저장·공개 전환만으로는 바뀌지 않습니다
    $('#meta').innerHTML = `<span>최종 수정 ${fmtDate(current.publishedAt || current.updatedAt)}</span>${editor && current.updatedBy ? `<span aria-hidden="true">·</span><span>${esc(current.updatedBy)}</span>` : ''}${current.public === false ? '<span class="tag gray">비공개</span>' : ''}`;
    $('#meta').dataset.doc = current.id;
    // 조회수: 유저가 연 공개 문서만 셈(views.js), 편집자에게는 이 문서 숫자를 보여 줌(관리 → 조회수에 전체 표)
    if (current.public !== false) import('./assets/js/views.js').then((m) => m.countView(current.id)).catch(() => {});
    if (editor) {
      import('./assets/js/views.js').then((m) => m.getViews(current.id)).then((s) => {
        if ($('#meta').dataset.doc !== current.id || $('#meta').querySelector('.views')) return;
        $('#meta').insertAdjacentHTML('beforeend', `<span aria-hidden="true">·</span><a class="views" href="admin/index.html#views" title="같은 브라우저에서 같은 날 다시 본 것과 편집자가 본 것은 빼고 셉니다">조회 오늘 ${s.today} · 7일 ${s.week} · 전체 ${s.total}</a>`);
      }).catch(() => {});
    }
    // 같은 문서 · 같은 내용이면 본문은 그대로 둡니다 (서버에서 다시 받아도 스크롤 · 그림이 흔들리지 않게)
    const text = current.markdown || current.draft || '';
    if (!(shown && shown.id === current.id && shown.text === text)) {
      const content = $('#content');
      content.innerHTML = md.renderMarkdown(text);
      const toc = md.decorate(content);
      $('#toc').hidden = !toc.length;
      $('#toc').innerHTML = '<span class="label">목차</span>' + toc.map((t) => `<a class="${t.level === 3 ? 'h3' : ''}" href="#${t.id}">${esc(t.text)}</a>`).join('');
      shown = { id: current.id, text };
    }
    // 검색 결과에서 왔으면(?hl=검색어) 그 줄로 한 번만 이동
    if (at.hl && hlDone !== current.id + '|' + at.hl && md.highlightTerm($('#content'), at.hl)) hlDone = current.id + '|' + at.hl;
    $('#btn-edit').href = `admin/editor.html?p=${encodeURIComponent(current.id)}`;
    $('#btn-history').href = `admin/index.html#history:${encodeURIComponent(current.id)}`;
    $('#btn-history').style.display = '';

    // 이전/다음
    const idx = v.flat.findIndex((p) => p.id === current.id);
    const prev = idx >= 0 ? v.flat[idx - 1] : null, next = idx >= 0 ? v.flat[idx + 1] : null;
    const nav = $('#page-nav');
    nav.hidden = !(prev || next);
    nav.innerHTML = (prev ? `<a class="prev" href="guide.html?p=${encodeURIComponent(prev.id)}"><span class="k">이전</span><span>${esc(prev.title)}</span></a>` : '')
      + (next ? `<a class="next" href="guide.html?p=${encodeURIComponent(next.id)}"><span class="k">다음</span><span>${esc(next.title)}</span></a>` : '');
  }

  function paint() {
    if (!data || !md) return;
    const v = viewOf();
    const current = pick(v);
    renderTree(v, current);
    renderBody(v, current);
    fitTree();
    revealActive();
  }

  // 목차 칸 높이 = 화면에서 목차가 실제로 차지할 수 있는 높이
  // (맨 위에서는 머리말 아래부터 화면 끝까지, 내려가서 붙으면 화면 높이 - 여백)
  function fitTree() {
    const tree = $('#tree');
    const top = Math.max(tree.getBoundingClientRect().top, 16);
    tree.style.setProperty('--tree-max', Math.max(240, innerHeight - top - 16) + 'px');
  }
  addEventListener('scroll', fitTree, { passive: true });
  addEventListener('resize', fitTree);

  // 왼쪽 목차가 길 때: 지금 보는 문서가 목차 칸 안에 보이도록 목차만 스크롤 (창은 그대로)
  let revealed = null;
  function revealActive() {
    const tree = $('#tree');
    const a = tree.querySelector('.page.active, .solo.active');
    if (!a || a.getAttribute('href') === revealed || tree.scrollHeight <= tree.clientHeight) return;
    revealed = a.getAttribute('href');
    const t = tree.getBoundingClientRect(), r = a.getBoundingClientRect();
    if (r.top >= t.top && r.bottom <= t.bottom) return; // 이미 보이면 그대로
    tree.scrollTop += (r.top - t.top) - (tree.clientHeight - r.height) / 2;
  }

  // ---- 페이지를 다시 불러오지 않고 다른 문서로 ----
  const go = (href, push) => {
    const u = new URL(href, location.href);
    at = urlState(u);
    if (push) history.pushState(null, '', u.pathname + u.search + u.hash);
    paint();
    if (push) {
      if (u.hash) document.getElementById(decodeURIComponent(u.hash.slice(1)))?.scrollIntoView();
      else if (!at.hl) scrollTo(0, 0);
    }
    if ($('#tree').classList.contains('open')) setTreeOpen(false); // 휴대폰에서 목차를 열고 골랐으면 닫기
  };
  if (!standalone) {
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a[href]');
      if (!a || a.target === '_blank' || !a.closest('#tree, #page-nav, #content, #breadcrumb') || !data) return;
      const u = new URL(a.href, location.href);
      if (u.origin !== location.origin || u.pathname !== location.pathname) return; // 다른 페이지(홈 등)는 평소대로
      const p = u.searchParams.get('p');
      if (p && isFooterDoc(p)) return; // 약관 · 처리방침 · 법전은 모양이 달라 새로 엶
      if (u.search === location.search && u.hash) return; // 같은 문서 안 목차 이동
      e.preventDefault();
      go(u.href, true);
    });
    addEventListener('popstate', () => go(location.href, false));
  }

  // 1) 기억해 둔 공개 목차 · 문서로 바로 그림
  try {
    const c = JSON.parse(localStorage.getItem(DATA_KEY) || 'null');
    if (c && Array.isArray(c.sections) && Array.isArray(c.pages)) data = { sections: c.sections, pages: c.pages, extra: null };
  } catch {}
  await mdReady;
  paint();

  // 2) 서버에서 새로 받아 다시 그림 (바뀐 곳만 화면이 바뀜)
  try {
    const [{ watchAuth }, P] = await Promise.all([import('./assets/js/auth.js'), import('./assets/js/pages.js')]);
    let hinted = false;
    try { hinted = !!localStorage.getItem('pw_editor'); } catch {}
    // 지난번에 편집자가 아니었으면 로그인 확인을 기다리지 않고 공개 목록부터 받음
    const early = hinted ? null : Promise.all([P.listSections(), P.listPages()]);
    early?.catch(() => {});
    editor = await watchAuth();
    import('./assets/js/popups.js');
    const [sections, pages] = (!editor && early) ? await early : await Promise.all([P.listSections(), P.listPages({ editorView: !!editor })]);
    // 공개 문서만, 임시저장 원고는 빼고 기억 (날짜는 숫자로)
    try {
      const pub = pages.filter((p) => p.public !== false).map(({ draft, draftMeta, ...p }) => p);
      localStorage.setItem(DATA_KEY, JSON.stringify({ sections, pages: pub }, function (k, val) {
        const o = this[k];
        return o && typeof o.toMillis === 'function' ? o.toMillis() : val;
      }));
    } catch { /* 저장 공간이 모자라면 기억 없이 */ }
    data = { sections, pages, extra: null };
    if (at.slug && !pages.some((p) => p.id === at.slug)) data.extra = await P.getPage(at.slug, { editor: !!editor }).catch(() => null);
    fresh = true;
    paint();
  } catch (e) {
    console.warn(e);
    if (!data) {
      $('#tree-list').innerHTML = '<div class="empty">목차를 불러오지 못했습니다.</div>';
      $('#content').innerHTML = '<p>문서를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';
    }
  }
</script>
</body>
</html>
