<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 편집 — 펭귄서버 위키</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<script>window.PW_ROOT = '../';</script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="container stack" id="editor" style="gap: 16px; max-width: 1280px" hidden>

    <div class="editor-top">
      <div class="stack" style="gap: 8px; min-width: 0">
        <nav class="breadcrumb" aria-label="현재 위치" style="margin: 0">
          <a href="index.html#docs">문서 관리</a><span aria-hidden="true">›</span><span class="cur" id="crumb">새 문서</span>
        </nav>
        <input class="editor-title" id="title" type="text" aria-label="문서 제목" placeholder="문서 제목">
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap">
        <span class="subtitle" id="status" style="font-size: 12px; margin-right: 6px"></span>
        <a class="btn sm ghost" id="btn-history" href="index.html#history" hidden>이력</a>
        <a class="btn sm ghost" id="btn-view" href="../guide.html" target="_blank" rel="noopener" hidden>보기</a>
        <button type="button" class="btn sm secondary" id="btn-draft">임시저장</button>
        <button type="button" class="btn sm primary" id="btn-publish">게시</button>
      </div>
    </div>

    <div class="card plain editor-meta">
      <span style="display: inline-flex; align-items: center; gap: 8px">섹션 <select class="select" id="section" aria-label="섹션"><option value="">미배치</option></select></span>
      <span style="display: inline-flex; align-items: center; gap: 8px">순서 <input class="input" id="order" type="number" aria-label="문서 순서" style="width: 80px; text-align: center" value="10"></span>
      <span style="display: inline-flex; align-items: center; gap: 8px">주소 /guide/ <input class="input" id="slug" aria-label="문서 슬러그" style="width: 220px; font-family: var(--font-mono)" placeholder="예: how-to-join"></span>
      <label style="display: inline-flex; align-items: center; gap: 8px; margin-left: auto; cursor: pointer">공개 <span class="toggle on" id="public" role="switch" aria-checked="true" tabindex="0"></span></label>
    </div>

    <div class="editor-panes">
      <div class="card plain pane">
        <div class="pane-head">
          <span class="lbl">마크다운</span>
          <button type="button" class="tool" data-wrap="**" aria-label="굵게"><b>B</b></button>
          <button type="button" class="tool" data-wrap="_" aria-label="기울임"><i>I</i></button>
          <button type="button" class="tool" data-line="## " aria-label="제목 2" style="font-size: 11px">H2</button>
          <button type="button" class="tool" data-line="### " aria-label="제목 3" style="font-size: 11px">H3</button>
          <span aria-hidden="true" style="width: 1px; height: 18px; background: #C9B58B; margin: 0 4px"></span>
          <button type="button" class="tool" data-line="- " aria-label="목록">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          <button type="button" class="tool" data-insert="[링크 이름](https://)" aria-label="링크">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
          <button type="button" class="tool" id="tool-image" aria-label="이미지 올리기" title="이미지 올리기 (붙여넣기 · 끌어다 놓기도 됩니다)">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
          <input type="file" id="image-file" accept="image/*" multiple hidden>
          <button type="button" class="tool" data-insert="| 항목 | 값 | 비고 |&#10;| --- | --- | --- |&#10;|  |  |  |" aria-label="표">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M10 4v16"/></svg></button>
          <button type="button" class="tool" data-wrap="`" data-default="/명령어" aria-label="명령어 코드">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
          <button type="button" class="tool" data-insert="> [!안내] 내용을 적어 주세요" aria-label="안내 상자">
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></button>
        </div>
        <textarea class="editor-textarea" id="md" aria-label="마크다운 본문" spellcheck="false" placeholder="## 소제목
본문을 적어 주세요.

> [!안내] 안내 상자는 이렇게 씁니다.

- 목록
- `/명령어` 는 클릭 복사 칩이 됩니다

이미지는 툴바의 그림 버튼으로 올리거나, 여기에 붙여넣기(Ctrl+V) · 끌어다 놓기 하면 됩니다.
외부 이미지는 ![설명](https://주소) 로 넣습니다."></textarea>
      </div>
      <div class="card plain pane">
        <div class="pane-head"><span class="lbl">미리보기</span><span style="margin-left: auto; letter-spacing: 0; color: #8A7D66">유저에게 보이는 모습</span></div>
        <div class="prose" id="preview"></div>
      </div>
    </div>

    <div class="card plain editor-bottom">
      <span style="flex-shrink: 0">변경 요약</span>
      <input class="input" id="summary" type="text" aria-label="변경 요약" placeholder="이력에 남길 한 줄, 예: 오타 수정">
      <span style="flex-shrink: 0; font-size: 12px; color: #8A7D66">게시하면 이전 게시본이 이력에 보관됩니다</span>
    </div>

  </div>
  <div class="container" id="gate"><div class="loading">권한을 확인하는 중입니다</div></div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter, $, esc, param, toast, fmtDate } from '../assets/js/ui.js';
  renderHeader('admin');
  renderFooter();

  const { requireEditor } = await import('../assets/js/auth.js');
  const me = await requireEditor();
  if (!me) throw new Error('redirect');
  const P = await import('../assets/js/pages.js');
  const { renderMarkdown, resolveImages } = await import('../assets/js/markdown.js');

  const el = {
    title: $('#title'), md: $('#md'), preview: $('#preview'), section: $('#section'), order: $('#order'),
    slug: $('#slug'), pub: $('#public'), summary: $('#summary'), status: $('#status'), crumb: $('#crumb'),
  };
  let slug = param('p');
  let existing = null;
  let dirty = false;

  // 섹션 목록
  const sections = await P.listSections();
  const top = sections.filter((s) => !s.parentId);
  el.section.innerHTML = '<option value="">미배치</option>' + top.map((t) =>
    `<option value="${t.id}">${esc(t.name)}</option>` +
    sections.filter((c) => c.parentId === t.id).map((c) => `<option value="${c.id}">&nbsp;&nbsp;└ ${esc(c.name)}</option>`).join('')
  ).join('');

  if (slug) {
    existing = await P.getPage(slug);
    if (!existing) { toast('문서를 찾을 수 없습니다'); slug = null; }
  }
  if (existing) {
    el.title.value = existing.title || '';
    el.md.value = existing.draft || existing.markdown || '';
    el.section.value = existing.sectionId || '';
    el.order.value = existing.order ?? 10;
    el.slug.value = existing.id; el.slug.disabled = true;
    setPublic(existing.public !== false);
    el.crumb.textContent = existing.title;
    el.status.textContent = existing.draft ? `임시저장본 편집 중 · 게시본 ${fmtDate(existing.publishedAt, true)}` : `게시본 ${fmtDate(existing.publishedAt || existing.updatedAt, true)}`;
    $('#btn-history').hidden = false; $('#btn-history').href = `index.html#history:${encodeURIComponent(slug)}`;
    $('#btn-view').hidden = false; $('#btn-view').href = `../guide.html?p=${encodeURIComponent(slug)}`;
  } else {
    const preSec = param('s'); if (preSec) el.section.value = preSec;
  }
  $('#gate').hidden = true; $('#editor').hidden = false;
  render();

  function setPublic(on) { el.pub.classList.toggle('on', on); el.pub.setAttribute('aria-checked', String(on)); }
  el.pub.addEventListener('click', () => setPublic(!el.pub.classList.contains('on')));
  el.pub.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); el.pub.click(); } });

  function render() { el.preview.innerHTML = renderMarkdown(el.md.value) || '<p style="color:#8A7D66">왼쪽에 내용을 입력하면 여기에 미리보기가 나타납니다.</p>'; resolveImages(el.preview); }
  let timer;
  el.md.addEventListener('input', () => { dirty = true; clearTimeout(timer); timer = setTimeout(render, 150); });
  el.title.addEventListener('input', () => {
    dirty = true;
    if (!existing && !el.slug.dataset.touched) el.slug.value = P.slugFromTitle(el.title.value);
  });
  el.slug.addEventListener('input', () => { el.slug.dataset.touched = '1'; });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // 툴바
  document.querySelector('.pane-head').addEventListener('click', (e) => {
    const b = e.target.closest('.tool'); if (!b) return;
    const ta = el.md, s = ta.selectionStart, t = ta.selectionEnd, v = ta.value;
    const sel = v.slice(s, t);
    let ins, cs = s, ce = t;
    if (b.dataset.wrap) { const w = b.dataset.wrap; const body = sel || b.dataset.default || '텍스트'; ins = w + body + w; cs = s + w.length; ce = cs + body.length; }
    else if (b.dataset.line) { const ls = v.lastIndexOf('\n', s - 1) + 1; ta.value = v.slice(0, ls) + b.dataset.line + v.slice(ls); ta.setSelectionRange(s + b.dataset.line.length, t + b.dataset.line.length); ta.focus(); dirty = true; render(); return; }
    else if (b.dataset.insert) { const text = b.dataset.insert.replace(/&#10;/g, '\n'); ins = (s > 0 && v[s - 1] !== '\n' ? '\n' : '') + text + '\n'; cs = s + ins.length; ce = cs; }
    ta.value = v.slice(0, s) + ins + v.slice(t);
    ta.setSelectionRange(cs, ce); ta.focus(); dirty = true; render();
  });

  // ---- 이미지 올리기: 브라우저에서 줄여서(긴 변 1600px, WebP) Firestore images/{id} 에 저장하고 ![설명](img:ID) 를 끼워 넣습니다
  const { db, collection, addDoc, serverTimestamp } = await import('../assets/js/firebase.js');
  const MAX_DATA = 900 * 1024; // Firestore 문서 1MiB 제한 안쪽
  async function compressImage(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
    let scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    let q = 0.85;
    const canvas = document.createElement('canvas');
    // WebP 인코딩이 안 되는 브라우저(구형 Safari)는 JPEG로
    canvas.width = 2; canvas.height = 2;
    const type = canvas.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
    for (let i = 0; i < 12; i++) {
      const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(bmp, 0, 0, w, h);
      const dataUrl = canvas.toDataURL(type, q);
      if (dataUrl.length <= MAX_DATA) return { dataUrl, w, h };
      if (q > 0.55) q -= 0.1; else scale *= 0.75;
    }
    throw new Error('이미지를 충분히 줄이지 못했습니다');
  }
  function insertAtCursor(text) {
    const ta = el.md, s = ta.selectionStart, t = ta.selectionEnd, v = ta.value;
    const ins = (s > 0 && v[s - 1] !== '\n' ? '\n' : '') + text + '\n';
    ta.value = v.slice(0, s) + ins + v.slice(t);
    ta.setSelectionRange(s + ins.length, s + ins.length); ta.focus(); dirty = true; render();
  }
  let uploading = 0;
  async function uploadImages(files) {
    const list = Array.from(files || []).filter((f) => f.type.startsWith('image/'));
    if (!list.length) return;
    for (const file of list) {
      if (file.size > 20 * 1024 * 1024) { toast(`${file.name}: 20MB 이하만 올릴 수 있습니다`); continue; }
      const marker = `![올리는 중… ${file.name.replace(/[\[\]()]/g, '')}]()`;
      insertAtCursor(marker);
      if (!uploading) el.status.dataset.keep = el.status.textContent;
      uploading++; el.status.textContent = `이미지 올리는 중 (${uploading})`;
      try {
        const { dataUrl, w, h } = await compressImage(file);
        const ref = await addDoc(collection(db, 'images'), {
          data: dataUrl, name: file.name, w, h, bytes: dataUrl.length, by: me.name, pageId: slug || el.slug.value || '', createdAt: serverTimestamp(),
        });
        const alt = file.name.replace(/\.[^.]+$/, '').replace(/[\[\]]/g, '');
        el.md.value = el.md.value.replace(marker, `![${alt}](img:${ref.id})`);
      } catch (err) {
        console.error(err);
        el.md.value = el.md.value.replace(marker + '\n', '').replace(marker, '');
        toast(`${file.name}: 올리지 못했습니다 (${err.message || err})`);
      } finally {
        uploading--; el.status.textContent = uploading ? `이미지 올리는 중 (${uploading})` : (el.status.dataset.keep || '');
        dirty = true; render();
      }
    }
  }
  $('#tool-image').addEventListener('click', () => $('#image-file').click());
  $('#image-file').addEventListener('change', (e) => { uploadImages(e.target.files); e.target.value = ''; });
  el.md.addEventListener('paste', (e) => {
    const files = Array.from(e.clipboardData?.files || []).filter((f) => f.type.startsWith('image/'));
    if (files.length) { e.preventDefault(); uploadImages(files); }
  });
  el.md.addEventListener('dragover', (e) => { if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); el.md.classList.add('drop'); } });
  el.md.addEventListener('dragleave', () => el.md.classList.remove('drop'));
  el.md.addEventListener('drop', (e) => {
    el.md.classList.remove('drop');
    if (e.dataTransfer?.files?.length) { e.preventDefault(); uploadImages(e.dataTransfer.files); }
  });

  function collect() {
    const title = el.title.value.trim();
    const id = (existing ? existing.id : el.slug.value.trim()) || P.slugFromTitle(title);
    if (uploading) { toast('이미지를 아직 올리는 중입니다. 잠시 후 저장해 주세요'); return null; }
    if (!title) { toast('제목을 입력해 주세요'); return null; }
    if (!/^[\p{L}\p{N}-]+$/u.test(id)) { toast('주소(슬러그)는 글자, 숫자, 하이픈만 쓸 수 있습니다'); return null; }
    return { id, title, sectionId: el.section.value || null, order: Number(el.order.value) || 0, markdown: el.md.value, public: el.pub.classList.contains('on') };
  }
  async function afterSave(id) {
    dirty = false;
    if (!existing) { existing = await P.getPage(id); slug = id; el.slug.disabled = true; history.replaceState(null, '', `editor.html?p=${encodeURIComponent(id)}`); $('#btn-history').hidden = false; $('#btn-history').href = `index.html#history:${encodeURIComponent(id)}`; $('#btn-view').hidden = false; $('#btn-view').href = `../guide.html?p=${encodeURIComponent(id)}`; }
    el.crumb.textContent = el.title.value.trim();
  }

  $('#btn-draft').addEventListener('click', async () => {
    const d = collect(); if (!d) return;
    if (!existing && (await P.pageExists(d.id))) return toast('같은 주소의 문서가 이미 있습니다');
    await P.saveDraft(d.id, { title: d.title, sectionId: d.sectionId, order: d.order, draft: d.markdown }, me.name);
    await afterSave(d.id);
    el.status.textContent = `임시저장 ${fmtDate(new Date(), true)}`;
    toast('임시저장했습니다 (유저에게는 아직 이전 게시본이 보입니다)');
  });
  $('#btn-publish').addEventListener('click', async () => {
    const d = collect(); if (!d) return;
    if (!existing && (await P.pageExists(d.id))) return toast('같은 주소의 문서가 이미 있습니다');
    const summary = el.summary.value.trim();
    if (existing && existing.markdown && !summary && !confirm('변경 요약 없이 게시할까요?')) return;
    await P.publish(d.id, { title: d.title, sectionId: d.sectionId, order: d.order, markdown: d.markdown, public: d.public }, me.name, summary);
    await afterSave(d.id);
    existing = await P.getPage(d.id);
    el.summary.value = '';
    el.status.textContent = `게시 ${fmtDate(new Date(), true)}`;
    toast(d.public ? '게시했습니다' : '비공개 상태로 저장했습니다');
  });
</script>
</body>
</html>
