<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 로그인 — 펭귄서버 위키</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<script>window.PW_ROOT = '../';</script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div class="login-wrap">
    <form class="card login-card" id="login-form" novalidate>
      <div class="head">
        <span class="icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A4529" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <h1>관리자 로그인</h1>
        <span class="subtitle" style="font-size: 13px">가이드 · 운영자 전용</span>
      </div>
      <div class="field">
        <label for="email">아이디 (이메일)</label>
        <input class="input" id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6A4529; cursor: pointer">
        <input type="checkbox" id="remember" checked style="width: 16px; height: 16px; margin: 0; accent-color: #A63A2B">
        이 브라우저에서 로그인 유지
      </label>
      <div class="form-error" id="error" hidden></div>
      <button type="submit" class="btn primary" id="submit" style="height: 50px; font-size: 16px; margin-top: 4px">로그인</button>
      <button type="button" class="btn sm ghost" id="forgot" style="align-self: center; border: 0">비밀번호를 잊으셨나요?</button>
      <div class="notice-box" style="font-size: 12px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6A4529" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        로그인 시각과 접속 환경이 기록됩니다
      </div>
    </form>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter, $, param } from '../assets/js/ui.js';
  renderHeader('admin');
  renderFooter();

  const { watchAuth, login, authErrorMessage, sendResetMail } = await import('../assets/js/auth.js');
  const next = param('next') || 'index.html';
  const go = () => { location.replace(next.startsWith('http') ? 'index.html' : next); };

  // 이미 로그인된 편집자는 바로 관리 화면으로
  watchAuth().then((e) => { if (e) go(); });

  const form = $('#login-form'), err = $('#error'), btn = $('#submit');
  // 비밀번호 재설정: 아이디 칸의 이메일로 링크를 보냅니다
  $('#forgot').addEventListener('click', async () => {
    err.hidden = true;
    const email = $('#email').value.trim();
    if (!email) { err.textContent = '아이디(이메일)를 먼저 입력한 뒤 눌러 주세요.'; err.hidden = false; return; }
    try { await sendResetMail(email); err.style.color = 'var(--green)'; err.textContent = `${email} 로 재설정 메일을 보냈습니다. 메일의 링크에서 새 비밀번호를 정한 뒤 로그인해 주세요. (스팸함도 확인)`; err.hidden = false; }
    catch (e) { err.style.color = ''; err.textContent = e.code === 'auth/user-not-found' ? '이 이메일로 만들어진 계정이 없습니다.' : authErrorMessage(e); err.hidden = false; }
  });
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.hidden = true;
    const email = $('#email').value.trim(), pw = $('#password').value;
    if (!email || !pw) { err.textContent = '아이디와 비밀번호를 입력해 주세요.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = '확인 중…';
    try {
      await login(email, pw, { remember: $('#remember').checked });
      go();
    } catch (e) {
      err.textContent = authErrorMessage(e);
      err.hidden = false;
      btn.disabled = false; btn.textContent = '로그인';
    }
  });
</script>
</body>
</html>
